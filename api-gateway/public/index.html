<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Login Screen -->
    <div id="loginScreen" class="screen active">
      <div class="login-container">
        <h1>Chat App</h1>
        <form id="loginForm">
          <input type="email" id="loginEmail" placeholder="Email" required />
          <input type="password" id="loginPassword" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
      </div>
    </div>

    <!-- Signup Screen -->
    <div id="signupScreen" class="screen">
      <div class="login-container">
        <h1>Create Account</h1>
        <form id="signupForm">
          <input type="text" id="signupName" placeholder="Name" required />
          <input type="email" id="signupEmail" placeholder="Email" required />
          <input type="password" id="signupPassword" placeholder="Password" required />
          <input
            type="password"
            id="signupPasswordConfirm"
            placeholder="Confirm Password"
            required
          />
          <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
      </div>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen" class="screen">
      <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar">
          <div class="sidebar-header">
            <h2>Chats</h2>
            <button id="logoutBtn" class="icon-btn" title="Logout">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
            </button>
          </div>
          <div class="search-bar">
            <input type="text" id="searchUsers" placeholder="Search users..." />
          </div>
          <div id="chatList" class="chat-list">
            <!-- Chat items will be dynamically added here -->
          </div>
          <div class="user-info">
            <div class="user-details">
              <span id="userName"></span>
            </div>
          </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
          <div id="noChatSelected" class="no-chat-selected">
            <h2>Select a chat to start messaging</h2>
            <p>Choose from your existing conversations or start a new one</p>
          </div>

          <div id="chatContent" class="chat-content" style="display: none">
            <!-- Chat Header -->
            <div class="chat-header">
              <div class="chat-header-info">
                <div class="chat-avatar">
                  <span id="chatInitials"></span>
                </div>
                <div>
                  <h3 id="chatName"></h3>
                  <span id="chatStatus" class="chat-status">Online</span>
                </div>
              </div>
            </div>

            <!-- Messages Area -->
            <div id="messagesArea" class="messages-area">
              <!-- Messages will be dynamically added here -->
            </div>

            <!-- Message Input -->
            <div class="message-input-area">
              <form id="messageForm">
                <input
                  type="text"
                  id="messageInput"
                  placeholder="Type a message..."
                  required
                  autocomplete="off"
                />
                <button type="submit" class="send-btn">
                  <svg
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
