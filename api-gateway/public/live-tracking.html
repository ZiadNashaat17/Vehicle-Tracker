<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle Live Tracking</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
      }
      .section {
        background: #f5f5f5;
        padding: 20px;
        margin: 20px 0;
        border-radius: 8px;
        border: 1px solid #ddd;
      }
      .hidden {
        display: none;
      }
      #status {
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        font-weight: bold;
      }
      .connected {
        background-color: #d4edda;
        color: #155724;
      }
      .disconnected {
        background-color: #f8d7da;
        color: #721c24;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
      }
      #records {
        border: 1px solid #ddd;
        padding: 10px;
        margin-top: 20px;
        height: 400px;
        overflow-y: auto;
        background-color: #f9f9f9;
      }
      .record {
        margin: 5px 0;
        padding: 10px;
        background-color: white;
        border-left: 3px solid #007bff;
      }
      button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 5px;
      }
      button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      button.success {
        background-color: #28a745;
      }
      input {
        padding: 8px;
        margin: 5px;
        width: 300px;
        display: block;
      }
      .user-info {
        background: white;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
      }
      h2 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <h1>🚗 Vehicle Live Tracking System</h1>

    <!-- Login Section -->
    <div id="loginSection" class="section">
      <h2>Login</h2>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button id="loginBtn">Login & Start Tracking</button>
    </div>

    <div id="status" class="disconnected">Status: Not Logged In</div>

    <!-- Live Updates (hidden initially) -->
    <div id="updatesSection" class="hidden">
      <h2>Live Updates:</h2>
      <div id="records"></div>
    </div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
      const statusDiv = document.getElementById("status");
      const recordsDiv = document.getElementById("records");
      const loginSection = document.getElementById("loginSection");
      const updatesSection = document.getElementById("updatesSection");
      const loginBtn = document.getElementById("loginBtn");

      let socket;
      let authToken = null;

      // Login and connect
      async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (!email || !password) {
          alert("Please enter email and password");
          return;
        }

        try {
          loginBtn.disabled = true;
          statusDiv.textContent = "Logging in...";

          // Login: use gateway origin (not hardcoded devtunnel)
          const response = await fetch(`${window.location.origin}/api/user/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || "Login failed");

          // robust token extraction
          authToken = result.token || result.data?.token;

          statusDiv.textContent = "Logged in - Connecting to live tracking...";
          statusDiv.className = "success";

          // Hide login and show updates
          loginSection.classList.add("hidden");
          updatesSection.classList.remove("hidden");

          // Connect to socket
          connectSocket();
        } catch (error) {
          console.error("Login error:", error);
          statusDiv.textContent = "Login failed";
          statusDiv.className = "disconnected";
          alert(`Login failed: ${error.message}`);
          loginBtn.disabled = false;
        }
      }

      // Connect to Socket.IO server
      function connectSocket() {
        // Socket connect: use gateway origin and explicit path so proxy (/socket.io) is used
        socket = io(window.location.origin, {
          path: "/socket.io",
          auth: { token: authToken },
          transports: ["websocket", "polling"],
        });

        socket.on("connect", () => {
          console.log("✓ Connected to WebSocket");
          statusDiv.textContent = "Status: Connected - Receiving live updates";
          statusDiv.className = "connected";
        });

        socket.on("disconnect", () => {
          console.log("✗ Disconnected from WebSocket");
          statusDiv.textContent = "Status: Disconnected";
          statusDiv.className = "disconnected";
        });

        socket.on("device:live", data => {
          console.log("📍 Device update received:", data);
          addRecord(data);
        });

        socket.on("error", error => {
          console.error("Socket error:", error);
        });
      }

      function addRecord(record) {
        const recordEl = document.createElement("div");
        recordEl.className = "record";
        recordEl.innerHTML = `
          <strong>${new Date().toLocaleTimeString()}</strong><br>
          <pre>${JSON.stringify(record, null, 2)}</pre>
        `;
        recordsDiv.insertBefore(recordEl, recordsDiv.firstChild);
      }

      // Event listener
      loginBtn.addEventListener("click", login);
    </script>
  </body>
</html>
