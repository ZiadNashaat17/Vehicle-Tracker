<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Vehicle Tracker</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        max-width: 500px;
        width: 100%;
        padding: 40px;
        animation: slideIn 0.5s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h1 {
        color: #2193b0;
        font-size: 28px;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .header p {
        color: #666;
        font-size: 14px;
        line-height: 1.5;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
        font-size: 14px;
      }

      input[type="password"] {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.3s ease;
        font-family: inherit;
      }

      input[type="password"]:focus {
        outline: none;
        border-color: #2193b0;
        box-shadow: 0 0 0 3px rgba(33, 147, 176, 0.1);
      }

      .password-requirements {
        margin-top: 8px;
        padding: 12px;
        background-color: #f8f9fa;
        border-radius: 6px;
        font-size: 12px;
        color: #666;
      }

      .password-requirements ul {
        margin-left: 20px;
        margin-top: 5px;
      }

      .password-requirements li {
        margin-bottom: 3px;
      }

      .error-message {
        background-color: #fee;
        color: #c33;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
        border-left: 4px solid #c33;
      }

      .success-message {
        background-color: #efe;
        color: #2a7;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
        border-left: 4px solid #2a7;
      }

      .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(33, 147, 176, 0.3);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(33, 147, 176, 0.4);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .btn.loading .btn-text {
        display: none;
      }

      .btn.loading .spinner {
        display: block;
      }

      .back-link {
        text-align: center;
        margin-top: 20px;
      }

      .back-link a {
        color: #2193b0;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s ease;
      }

      .back-link a:hover {
        color: #1a7a96;
        text-decoration: underline;
      }

      @media (max-width: 600px) {
        .container {
          padding: 30px 20px;
        }

        .header h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🚗 Vehicle Tracker</h1>
        <p>Create a new password for your account. Make sure it's strong and secure.</p>
      </div>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="password">New Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your new password"
            required
            minlength="8"
          />
        </div>

        <div class="form-group">
          <label for="passwordConfirm">Confirm Password</label>
          <input
            type="password"
            id="passwordConfirm"
            name="passwordConfirm"
            placeholder="Confirm your new password"
            required
            minlength="8"
          />
        </div>

        <div class="password-requirements">
          <strong>Password requirements:</strong>
          <ul>
            <li>At least 8 characters long</li>
            <li>Both passwords must match</li>
          </ul>
        </div>

        <button type="submit" class="btn" id="submitBtn">
          <span class="btn-text">Reset Password</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="back-link">
        <a href="/login">Back to Login</a>
      </div>
    </div>

    <script>
      // Get the token from the URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      // If no token in query params, check if it's in the path
      const pathToken = window.location.pathname.split("/").pop();
      const resetToken = token || (pathToken !== "reset-password.html" ? pathToken : null);

      if (!resetToken) {
        showError("Invalid or missing reset token. Please use the link from your email.");
        document.getElementById("submitBtn").disabled = true;
      }

      const form = document.getElementById("resetPasswordForm");
      const errorDiv = document.getElementById("errorMessage");
      const successDiv = document.getElementById("successMessage");
      const submitBtn = document.getElementById("submitBtn");

      function showError(message) {
        errorDiv.textContent = message;
        errorDiv.style.display = "block";
        successDiv.style.display = "none";
      }

      function showSuccess(message) {
        successDiv.textContent = message;
        successDiv.style.display = "block";
        errorDiv.style.display = "none";
      }

      function hideMessages() {
        errorDiv.style.display = "none";
        successDiv.style.display = "none";
      }

      form.addEventListener("submit", async e => {
        e.preventDefault();
        hideMessages();

        const password = document.getElementById("password").value;
        const passwordConfirm = document.getElementById("passwordConfirm").value;

        // Client-side validation
        if (password.length < 8) {
          showError("Password must be at least 8 characters long.");
          return;
        }

        if (password !== passwordConfirm) {
          showError("Passwords do not match. Please try again.");
          return;
        }

        // Show loading state
        submitBtn.disabled = true;
        submitBtn.classList.add("loading");

        try {
          const response = await fetch(`/api/user/reset-password/${resetToken}`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              password,
              passwordConfirm,
            }),
          });

          const data = await response.json();

          if (response.ok) {
            showSuccess("Password reset successfully! Redirecting to login...");
            form.reset();

            // Store the token if provided
            if (data.token) {
              localStorage.setItem("token", data.token);
            }

            // Redirect to login or dashboard after 2 seconds
            setTimeout(() => {
              window.location.href = "/login";
            }, 2000);
          } else {
            showError(data.message || "Failed to reset password. Please try again.");
          }
        } catch (error) {
          console.error("Error:", error);
          showError("An error occurred. Please check your connection and try again.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.classList.remove("loading");
        }
      });

      // Real-time password match validation
      const passwordInput = document.getElementById("password");
      const passwordConfirmInput = document.getElementById("passwordConfirm");

      passwordConfirmInput.addEventListener("input", () => {
        if (passwordConfirmInput.value && passwordInput.value !== passwordConfirmInput.value) {
          passwordConfirmInput.style.borderColor = "#c33";
        } else {
          passwordConfirmInput.style.borderColor = "#e0e0e0";
        }
      });
    </script>
  </body>
</html>
