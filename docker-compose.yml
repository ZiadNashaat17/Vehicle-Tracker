version: '3'

services:
  # backend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: vehicle-tracker-backend
  #   ports:
  #     - '3000:3000'
  #   env_file:
  #     - ./config.env
  #   networks:
  #     - app-network
  #   depends_on:
  #     - mongo
  #     - redis

  mongo:
    image: mongo
    container_name: vehicle-tracker-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis
    container_name: vehicle-tracker-redis
    ports:
      - '6379:6379'
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
