<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Test</title>
  </head>
  <body>
    <h1>Socket.IO Connection Test</h1>
    <div id="status">Connecting...</div>
    <div id="messages"></div>

    <!-- Include Socket.IO client library -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>
      // Connect to your server
      const socket = io('http://localhost:3000');

      socket.on('connect', () => {
        console.log('Connected!', socket.id);
        document.getElementById('status').innerHTML = '✓ Connected! Socket ID: ' + socket.id;
      });

      // Listen for vehicle live updates
      socket.on('vehicle:live', data => {
        console.log('Live data:', data);
        const msg = document.createElement('div');
        msg.innerHTML = '<strong>vehicle:live:</strong> ' + JSON.stringify(data);
        document.getElementById('messages').appendChild(msg);
      });

      // Listen for new records
      socket.on('newRecord', data => {
        console.log('New record:', data);
        const msg = document.createElement('div');
        msg.innerHTML = '<strong>newRecord:</strong> ' + JSON.stringify(data);
        document.getElementById('messages').appendChild(msg);
      });

      socket.on('disconnect', () => {
        console.log('Disconnected');
        document.getElementById('status').innerHTML = '✗ Disconnected';
      });
    </script>
  </body>
</html>
